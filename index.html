<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MANLY The Office — Specialty coffee &amp; brunch, Firenze</title>
  <meta name="description" content="Specialty coffee e brunch di scuola australiana a San Frediano, Firenze. Via Pisana 48R.">
  <meta name="theme-color" content="#FAF7F2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 220' fill='none' stroke='%233F3B2A' stroke-width='9'%3E%3Ccircle cx='110' cy='110' r='104'/%3E%3Cpath d='M30 37 L49 76 L85 5 V215 M85 107 L144 209 M144 7 V212 M144 173 H197 V102 L185 34'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">

  <style>
    /* ===== Tokens ===== */
    :root {
      color-scheme: light;

      --bg: #FAF7F2;
      --surface: #F2ECE2;
      --ink: #3F3B2A;
      --ink-soft: #76705A;
      --line: #E2DACB;
      --accent: #D99A3B;
      --accent-ink: #2E2A1C;
      --ok: #4F7A4A;
      --warn: #B86E1F;
      --off: #8C8670;

      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Barlow", system-ui, -apple-system, sans-serif;

      --step--1: 0.875rem;
      --step-0: 1rem;
      --step-1: 1.25rem;
      --step-2: clamp(1.6rem, 1.3rem + 1.5vw, 2.1rem);
      --step-3: clamp(2.2rem, 1.7rem + 2.5vw, 3.2rem);

      --space-xs: 0.5rem;
      --space-s: 1rem;
      --space-m: 1.5rem;
      --space-l: 2.5rem;
      --space-xl: 4.5rem;

      --gutter: 16px;
      --max: 680px;
      --radius: 14px;
      --header-h: 56px;
    }

    /* ===== Base ===== */
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-h) + env(safe-area-inset-top));
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: var(--step-0);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    img, svg { display: block; max-width: 100%; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }

    h1, h2, h3 {
      font-family: var(--font-display);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .skip-link {
      position: absolute;
      left: var(--gutter);
      top: -100px;
      z-index: 100;
      padding: var(--space-xs) var(--space-s);
      background: var(--ink);
      color: var(--bg);
      border-radius: 8px;
    }
    .skip-link:focus { top: calc(var(--space-xs) + env(safe-area-inset-top)); }

    /* ===== Layout ===== */
    .wrap {
      width: 100%;
      max-width: var(--max);
      margin-inline: auto;
      padding-inline: max(var(--gutter), env(safe-area-inset-left)) max(var(--gutter), env(safe-area-inset-right));
    }

    .section { padding-block: var(--space-xl); }
    .section + .section { border-top: 1px solid var(--line); }

    .section__kicker {
      font-size: var(--step--1);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: var(--space-xs);
    }
    .section__title {
      font-size: var(--step-2);
      margin-bottom: var(--space-m);
    }

    /* ===== Header ===== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding-top: env(safe-area-inset-top);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }
    .site-header.is-scrolled { border-bottom-color: var(--line); }

    .site-header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-h);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }
    .brand .logo { width: 34px; height: 34px; }
    .brand__name {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .brand__name small {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      text-transform: none;
      color: var(--ink-soft);
      line-height: 1;
    }

    .logo { color: var(--ink); }

    /* ===== Selector de idioma ===== */
    .lang-switch {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .lang-switch button {
      min-width: 44px;
      min-height: 36px;
      padding: 0 0.75rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      font-size: var(--step--1);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      cursor: pointer;
    }
    .lang-switch button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
    }

    /* ===== Hero (base; se completa en feat/hero) ===== */
    .hero { padding-block: var(--space-l) var(--space-xl); }
    .hero__title {
      font-size: var(--step-3);
      margin-bottom: var(--space-xs);
    }
    .hero__title span { font-style: italic; }
    .hero__tagline {
      font-size: var(--step-1);
      color: var(--ink-soft);
    }

    /* ===== Huecos de foto ===== */
    .ph {
      display: grid;
      place-items: center;
      padding: var(--space-s);
      border: 1.5px dashed var(--off);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink-soft);
      font-size: var(--step--1);
      text-align: center;
    }
    .ph--4x5 { aspect-ratio: 4 / 5; }
    .ph--1x1 { aspect-ratio: 1 / 1; }
    .ph--3x2 { aspect-ratio: 3 / 2; }

    /* Marca de contenido pendiente (solo boceto) */
    .todo {
      padding: var(--space-s);
      border-left: 3px solid var(--accent);
      background: var(--surface);
      font-size: var(--step--1);
      color: var(--ink-soft);
    }

    /* ===== Footer ===== */
    .site-footer {
      padding-block: var(--space-l) calc(var(--space-l) + env(safe-area-inset-bottom));
      background: var(--ink);
      color: var(--bg);
      font-size: var(--step--1);
    }
    .site-footer .logo { width: 56px; height: 56px; color: var(--bg); margin-bottom: var(--space-s); }
  </style>
</head>
<body>
  <a class="skip-link" href="#contenuto" data-i18n="skip">Vai al contenuto</a>

  <!-- Logo: un solo símbolo, reutilizado con <use> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo-manly" viewBox="0 0 220 220">
      <g fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="110" cy="110" r="108" stroke-width="3"/>
        <path d="M30 37.4 L49 76.5 L85 5 V215"/>
        <path d="M85 107.5 L144 209 M85 180.5 H127.4 M144 7.5 V212.5"/>
        <path d="M144 173.5 H197 V102 L185 34 M197 102 L213 81 L188 35"/>
      </g>
    </symbol>
  </svg>

  <header class="site-header" id="top">
    <div class="wrap site-header__inner">
      <a class="brand" href="#top" aria-label="MANLY The Office">
        <svg class="logo" aria-hidden="true"><use href="#logo-manly"/></svg>
        <span class="brand__name">Manly <small>The Office</small></span>
      </a>

      <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.label" aria-label="Lingua">
        <button type="button" data-lang="it" aria-pressed="true" lang="it">IT</button>
        <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
      </div>
    </div>
  </header>

  <main id="contenuto">
    <!-- 1. Hero -->
    <section class="hero" id="inizio" aria-labelledby="hero-title">
      <div class="wrap">
        <h1 class="hero__title" id="hero-title">MANLY <span>The Office</span></h1>
        <p class="hero__tagline" data-i18n="hero.tagline">Specialty coffee &amp; brunch a San Frediano</p>
      </div>
    </section>

    <!-- 2. Orari -->
    <section class="section" id="orari" aria-labelledby="orari-title">
      <div class="wrap">
        <h2 class="section__title" id="orari-title" data-i18n="orari.title">Orari</h2>
        <p class="todo">feat/orari</p>
      </div>
    </section>

    <!-- 3. Menu -->
    <section class="section" id="menu" aria-labelledby="menu-title">
      <div class="wrap">
        <h2 class="section__title" id="menu-title" data-i18n="menu.title">Il menu</h2>
        <p class="todo">feat/menu</p>
      </div>
    </section>

    <!-- 4. Il nostro caffè -->
    <section class="section" id="caffe" aria-labelledby="caffe-title">
      <div class="wrap">
        <h2 class="section__title" id="caffe-title" data-i18n="caffe.title">Il nostro caffè</h2>
        <p class="todo">feat/il-nostro-caffe</p>
      </div>
    </section>

    <!-- 5. Shop -->
    <section class="section" id="shop" aria-labelledby="shop-title">
      <div class="wrap">
        <p class="section__kicker">Shop</p>
        <h2 class="section__title" id="shop-title" data-i18n="shop.title">L’Australiano a casa tua</h2>
        <p class="todo">feat/shop</p>
      </div>
    </section>

    <!-- 6. Storia -->
    <section class="section" id="storia" aria-labelledby="storia-title">
      <div class="wrap">
        <h2 class="section__title" id="storia-title" data-i18n="storia.title">La nostra storia</h2>
        <p class="todo">feat/storia</p>
      </div>
    </section>

    <!-- 7. Dove siamo -->
    <section class="section" id="dove" aria-labelledby="dove-title">
      <div class="wrap">
        <h2 class="section__title" id="dove-title" data-i18n="dove.title">Dove siamo</h2>
        <p class="todo">feat/dove-siamo</p>
      </div>
    </section>
  </main>

  <!-- 8. Footer -->
  <footer class="site-footer">
    <div class="wrap">
      <svg class="logo" aria-hidden="true"><use href="#logo-manly"/></svg>
      <p class="todo" style="background:transparent;color:inherit">feat/footer</p>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';

      /* ===== Textos ===== */
      var I18N = {
        it: {
          'meta.title': 'MANLY The Office — Specialty coffee & brunch, Firenze',
          'meta.desc': 'Specialty coffee e brunch di scuola australiana a San Frediano, Firenze. Via Pisana 48R.',
          'skip': 'Vai al contenuto',
          'lang.label': 'Lingua',
          'hero.tagline': 'Specialty coffee & brunch a San Frediano',
          'orari.title': 'Orari',
          'menu.title': 'Il menu',
          'caffe.title': 'Il nostro caffè',
          'shop.title': 'L’Australiano a casa tua',
          'storia.title': 'La nostra storia',
          'dove.title': 'Dove siamo'
        },
        en: {
          'meta.title': 'MANLY The Office — Specialty coffee & brunch, Florence',
          'meta.desc': 'Australian-style specialty coffee and brunch in San Frediano, Florence. Via Pisana 48R.',
          'skip': 'Skip to content',
          'lang.label': 'Language',
          'hero.tagline': 'Specialty coffee & brunch in San Frediano',
          'orari.title': 'Opening hours',
          'menu.title': 'Menu',
          'caffe.title': 'Our coffee',
          'shop.title': 'L’Australiano at home',
          'storia.title': 'Our story',
          'dove.title': 'Find us'
        }
      };

      var LANGS = ['it', 'en'];
      var STORAGE_KEY = 'manly-lang';

      function t(key) {
        var dict = I18N[document.documentElement.lang] || I18N.it;
        return dict[key] != null ? dict[key] : key;
      }

      function readStoredLang() {
        try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
      }

      function storeLang(lang) {
        try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) { /* modo privado */ }
      }

      // Italiano si el teléfono está en italiano; inglés en cualquier otro caso.
      function detectLang() {
        var stored = readStoredLang();
        if (LANGS.indexOf(stored) !== -1) return stored;
        var prefs = navigator.languages || [navigator.language || 'it'];
        return /^it\b/i.test(prefs[0] || '') ? 'it' : 'en';
      }

      function applyLang(lang) {
        document.documentElement.lang = lang;

        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          el.textContent = t(el.getAttribute('data-i18n'));
        });

        // data-i18n-attr="atributo:clave; otro:clave"
        document.querySelectorAll('[data-i18n-attr]').forEach(function (el) {
          el.getAttribute('data-i18n-attr').split(';').forEach(function (pair) {
            var parts = pair.split(':');
            if (parts.length === 2) el.setAttribute(parts[0].trim(), t(parts[1].trim()));
          });
        });

        document.title = t('meta.title');
        document.querySelector('meta[name="description"]').setAttribute('content', t('meta.desc'));

        document.querySelectorAll('.lang-switch button').forEach(function (btn) {
          btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang));
        });

        // Las secciones dinámicas (horario, shop) escuchan este evento para re-renderizarse
        document.dispatchEvent(new CustomEvent('langchange', { detail: { lang: lang } }));
      }

      document.querySelector('.lang-switch').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-lang]');
        if (!btn) return;
        storeLang(btn.dataset.lang);
        applyLang(btn.dataset.lang);
      });

      /* ===== Header: borde al hacer scroll ===== */
      var header = document.querySelector('.site-header');
      function onScroll() { header.classList.toggle('is-scrolled', window.scrollY > 8); }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      window.MANLY = { t: t, applyLang: applyLang };
      applyLang(detectLang());
    })();
  </script>
</body>
</html>
